# Fair Drop Redis settings. Redis holds only things that are safe to lose (rate-limit buckets,
# jti markers, the seats-remaining counter). Losing it may cost speed, never correctness.

# Reachable only inside the compose network; the host port is published on 127.0.0.1.
# (Redis does not allow trailing comments after a value, so comments get their own lines.)
bind 0.0.0.0
protected-mode no
port 6379

# No persistence: a restart starts empty and the API rebuilds what it needs from Postgres.
save ""
appendonly no

# Bounded memory. volatile-ttl evicts only keys that HAVE a TTL, soonest-expiring first.
# Never allkeys-lru: it could silently evict rate-limit buckets or jti markers. Every key we
# write has a TTL except drop:{id}:remaining, which is recomputable from Postgres.
maxmemory 512mb
maxmemory-policy volatile-ttl

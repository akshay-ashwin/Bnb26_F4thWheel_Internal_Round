# Fair Drop Postgres settings. Replaces the image default (config_file=...), so every setting
# the server needs is listed here. Postgres is the only source of truth: durability is not traded
# for speed.

listen_addresses = '*'
port = 5432

# Connections: 4 API workers x pool max 30 = 120, plus migrations/admin headroom.
max_connections = 200

# About 25% of the memory budget we assume Docker gives this container (2 GB). Raise it on a
# bigger Docker VM (see docs/PLATFORMS.md).
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# Durability. NEVER set this to off: the "500 seats never 501" and "one identity one seat"
# claims rest on committed transactions surviving a crash.
synchronous_commit = on
fsync = on
full_page_writes = on

# Slow-query visibility: anything over 200 ms is logged with its duration.
log_min_duration_statement = 200
log_timezone = 'UTC'
timezone = 'UTC'

# lock_timeout is left at the default (0). Code sets it per transaction where it matters.

# The default pg_hba.conf lives in the data directory and is not replaced here.

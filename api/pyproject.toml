[project]
name = "fairdrop-api"
version = "0.1.0"
description = "Fair Drop backend (FastAPI). Runs only in a Linux container."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# An application, not a library: install dependencies only, run from source.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations in signatures are the framework idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, seeded (non-crypto) randomness, fake secrets and dependency defaults are fine.
"tests/**" = ["S101", "S105", "S311", "B008"]
# The stress runner is a script: asserts are its checks, and long SQL/report lines are fine.
"scripts/**" = ["S101", "E501"]

[tool.mypy]
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# asyncpg ships no type information.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session so session-scoped async fixtures (database setup) work.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

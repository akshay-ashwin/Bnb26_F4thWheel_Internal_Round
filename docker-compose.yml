services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fairdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fairdrop}
      POSTGRES_DB: ${POSTGRES_DB:-fairdrop}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fairdrop}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fairdrop}:${POSTGRES_PASSWORD:-fairdrop}@postgres:5432/${POSTGRES_DB:-fairdrop}
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:

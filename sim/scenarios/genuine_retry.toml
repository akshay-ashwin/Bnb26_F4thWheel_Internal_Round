# S3: 200 genuine users, each making 4-5 entry attempts, refreshing once and opening a second
# tab, while one attacker floods with 10,000 clients on ONE identity and a small farm of 100
# identities tries to win more than its share. Run in both modes with the same seed.
name = "genuine_retry"
seed = 42
capacity = 50
registration_s = 30
claim_window_s = 25
bot_connections = 1000

[humans]
count = 200
arrival = { type = "uniform", spread_s = 10 }
entry_attempts = [4, 5]
second_tab_p = 1.0
refresh_p = 1.0

[[attackers]]
actor_id = "FLOOD"
kind = "flood"
identities = 1
clients_per_identity = 10000
rps_per_client = 20
devices = 1
subnets = 1
ips_per_subnet = 4
polite = false

[[attackers]]
actor_id = "FARM"
kind = "farm"
identities = 100
clients_per_identity = 1
rps_per_client = 0.5
devices = 10
subnets = 5
ips_per_subnet = 4
step_up_success_p = 0.0

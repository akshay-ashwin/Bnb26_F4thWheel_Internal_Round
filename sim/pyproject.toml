[project]
name = "fairdrop-sim"
version = "0.1.0"
description = "Fair Drop attack simulator and evaluator. Runs in a container or natively on Windows/macOS."
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Never a hard dependency: uvloop does not exist for Windows. The container image installs it.
fast = ["uvloop>=0.21; sys_platform != 'win32'"]

[project.scripts]
sim = "sim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sim"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
